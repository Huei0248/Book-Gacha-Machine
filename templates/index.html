<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ee">
  <title>靈感選書扭蛋機</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="/" aria-label="回到首頁">📚 靈感選書</a><span>今天，讓一本書帶你出發</span></header>
  <main class="layout">
    <section class="intro"><p class="eyebrow">BOOK GACHA MACHINE</p><h1>轉出下一段<br><span>閱讀靈感</span></h1><p>選一個此刻的心情，讓扭蛋替你找到下一本書。</p><div class="sparkles">✦　✧　✦</div></section>
    <section class="machine card" aria-label="選書扭蛋機">
      <div class="machine-top"><span>今日的閱讀靈感</span><span class="status-dot">● 準備好了</span></div>
      <div class="subjects" role="group" aria-label="選擇主題">
        <button class="subject selected" data-subject="random">🎲 隨機驚喜</button>
        {% for key, label in subjects.items() %}<button class="subject" data-subject="{{ key }}">{{ label }}</button>{% endfor %}
      </div>
      <div class="gacha-stage"><div id="capsule" class="capsule" aria-hidden="true"><span>✦</span></div><p id="hint">準備好迎接一場閱讀冒險了嗎？</p></div>
      <button id="drawButton" class="draw-button">轉一顆扭蛋 <span>↗</span></button>
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <article id="result" class="result" hidden></article>
    </section>
    <aside class="side-card card"><div class="side-heading"><div><span class="eyebrow">YOUR SHELF</span><h2>我的抽書紀錄</h2></div><button id="clearHistory" class="text-button">清空</button></div><p class="side-note">最近的 10 本靈感，都收在這裡。</p><ul id="history" class="history"></ul><div id="emptyHistory" class="empty-history">翻開一段新故事，<br>你的紀錄就會出現在這裡 ✨</div></aside>
  </main>
  <footer>書籍資料來源：<a href="https://openlibrary.org/" target="_blank" rel="noopener noreferrer">Open Library</a><span>為自己留一點閱讀的驚喜</span></footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
